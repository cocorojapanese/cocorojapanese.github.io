<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전공기초 [1과 おはよう]</title>
<style>
  :root{
    --bg:#eef5f5;
    --card:#ffffff;
    --accent:#7c5cff;
    --accent2:#149c8a;
    --blue:#6c4fd6;
    --text:#2c2c2c;
    --sub:#8a8a8a;
    --border:#d9e6e4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(160deg, #eef8f7 0%, #eef0fb 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .logo-flower{
    position:relative;
    width:52px;
    height:52px;
    flex-shrink:0;
  }
  .petal{
    position:absolute;
    mix-blend-mode:multiply;
  }
  .petal.yellow{
    width:32px;height:36px;
    top:0;left:11px;
    background:#f5e08a;
    border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
    transform:rotate(-8deg);
  }
  .petal.blue{
    width:30px;height:30px;
    top:13px;left:0;
    background:#a9d3e8;
    border-radius:50%;
  }
  .petal.pink{
    width:34px;height:36px;
    top:20px;left:10px;
    background:#f2c1da;
    border-radius:45% 45% 55% 55% / 40% 40% 60% 60%;
  }
  .petal.green{
    width:26px;height:26px;
    top:10px;left:24px;
    background:#c7d98d;
    border-radius:50%;
  }
  .petal.peach{
    width:20px;height:20px;
    top:4px;left:16px;
    background:#f0ba90;
    border-radius:50%;
  }
  .logo-flower span{
    position:absolute;
    font-size:9px;
    font-weight:700;
    color:#fff;
    text-shadow:0 0 2px rgba(0,0,0,0.15);
  }
  .logo-flower .ch1{ top:20px; left:6px; }
  .logo-flower .ch2{ top:20px; left:19px; }
  .logo-flower .ch3{ top:16px; left:31px; color:#e9e9e9; }
  .brand-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .brand-name .c1{ color:#e79ac0; }
  .brand-name .c2{ color:#8ec3e0; }
  .brand-name .c3{ color:#9a9a9a; }
  h1{
    font-size:20px;
    margin:0 0 4px;
    font-weight:700;
  }
  .subtitle{
    font-size:13px;
    color:var(--sub);
    margin-bottom:18px;
  }
  .controls-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:16px;
  }
  .tab{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    cursor:pointer;
    color:var(--text);
  }
  .tab.active{
    background:var(--accent2);
    color:#fff;
    border-color:var(--accent2);
  }
  .progress-wrap{
    width:100%;
    max-width:420px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--sub);
    margin-bottom:10px;
  }
  .progress-bar-bg{
    width:100%;
    max-width:420px;
    height:5px;
    background:var(--border);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--accent2);
    transition:width .2s ease;
  }
  .card-wrap{
    width:100%;
    max-width:420px;
    height:320px;
    perspective:1200px;
    margin-bottom:22px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card.flipped{
    transform:rotateY(180deg);
  }
  .card.no-anim{
    transition:none !important;
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:18px;
    background:var(--card);
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    border:1px solid var(--border);
  }
  .face.back{
    transform:rotateY(180deg);
  }
  .tag{
    position:absolute;
    top:14px;
    left:16px;
    font-size:11px;
    color:var(--sub);
    background:var(--bg);
    padding:3px 9px;
    border-radius:10px;
  }
  .word{
    font-size:clamp(44px, 14vw, 66px);
    font-weight:700;
    line-height:1.3;
    word-break:keep-all;
  }
  .reading{
    font-size:18px;
    color:var(--accent2);
    margin-top:10px;
  }
  .meaning{
    font-size:clamp(22px, 6.5vw, 28px);
    font-weight:700;
    color:var(--blue);
    margin-bottom:10px;
  }
  .word-back{
    font-size:clamp(28px, 8.5vw, 36px);
    font-weight:400;
    color:var(--text);
    margin-bottom:10px;
  }
  .reading-small{
    font-size:clamp(22px, 6.5vw, 28px);
    font-weight:700;
    color:var(--text);
  }
  .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:6px;
  }
  .nav-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:16px;
  }
  .nav-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:var(--accent2);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .nav-btn:active{
    transform:scale(0.95);
  }
  .flip-btn{
    background:var(--accent);
    border-radius:24px;
    width:auto;
    padding:0 22px;
    font-size:14px;
    height:44px;
  }
  .know-row{
    display:flex;
    gap:10px;
    margin-bottom:8px;
  }
  .know-btn{
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    cursor:pointer;
  }
  .know-btn.on-known{
    background:#e7f3ea;
    border-color:#3f9a55;
    color:#2c6e3d;
  }
  .know-btn.on-unknown{
    background:#fbeaea;
    border-color:var(--accent);
    color:var(--accent);
  }
  .bottom-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:6px;
  }
  .small-btn{
    padding:7px 13px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#fff;
    font-size:12px;
    color:var(--sub);
    cursor:pointer;
  }
  .small-btn.active{
    background:#fff3e0;
    border-color:#e0a030;
    color:#a06a00;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    margin-top:40px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="brand">
  <div class="logo-flower">
    <div class="petal yellow"></div>
    <div class="petal blue"></div>
    <div class="petal pink"></div>
    <div class="petal green"></div>
    <div class="petal peach"></div>
    <span class="ch1">こ</span><span class="ch2">こ</span><span class="ch3">ろ</span>
  </div>
  <div class="brand-name"><span class="c1">코코로</span><span class="c2">원어민</span><span class="c3">일본어</span></div>
</div>

<h1>전공기초 [1과 おはよう]</h1>
<div class="subtitle">카드를 클릭(또는 Space)하면 뒤집혀요 · 총 <span id="totalCount">0</span>개</div>

<div class="controls-row" id="catTabs"></div>

<div class="progress-wrap">
  <span id="posLabel">0 / 0</span>
  <span id="knownLabel">외운 단어: 0</span>
</div>
<div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>

<div class="card-wrap">
  <div class="card" id="card">
    <div class="face front">
      <span class="tag" id="tagFront"></span>
      <div class="word" id="wordFront"></div>
      <div class="hint">탭해서 뜻 보기</div>
    </div>
    <div class="face back">
      <span class="tag" id="tagBack"></span>
      <div class="word-back" id="wordBack"></div>
      <div class="reading-small" id="readingBack"></div>
      <div class="meaning" id="meaningBack"></div>
    </div>
  </div>
</div>

<div class="know-row">
  <button class="know-btn" id="knownBtn">✓ 외웠어요</button>
  <button class="know-btn" id="unknownBtn">✗ 다시 볼래요</button>
</div>

<div class="nav-row">
  <button class="nav-btn" id="prevBtn">‹</button>
  <button class="nav-btn flip-btn" id="flipBtn">뒤집기</button>
  <button class="nav-btn" id="nextBtn">›</button>
</div>

<div class="bottom-row">
  <button class="small-btn" id="shuffleBtn">🔀 섞기</button>
  <button class="small-btn" id="resetShuffleBtn">↺ 원래 순서</button>
  <button class="small-btn" id="reviewOnlyBtn">📌 안 외운 단어만</button>
  <button class="small-btn" id="resetProgressBtn">🗑 기록 초기화</button>
</div>

<script>
// ---------------- 단어 데이터 ----------------
const DATA = [

  {k:"ひさしぶり", r:"", m:"오랜만", cat:"가나"},
  {k:"じゃあね", r:"", m:"그럼 안녕", cat:"가나"},
  {k:"バイバイ", r:"", m:"Bye Bye", cat:"가나"},
  {k:"お元気ですか", r:"おげんきですか", m:"잘 지냈어요?", cat:"한자"},
  {k:"~です(か)", r:"", m:"~입니다(입니까?)", cat:"가나"},
  {k:"おかげさまで", r:"", m:"덕분에", cat:"가나"},

  {k:"~の", r:"", m:"~의, ~인", cat:"가나"},
  {k:"はじめまして", r:"", m:"처음 뵙겠습니다", cat:"가나"},
  {k:"~さん", r:"", m:"~씨, ~님", cat:"가나"},
  {k:"どうぞ よろしく", r:"", m:"잘 부탁해요", cat:"가나"},

  {k:"先生", r:"せんせい", m:"선생님", cat:"한자"},
  {k:"母", r:"はは", m:"어머니", cat:"한자"},
  {k:"知り合い", r:"しりあい", m:"지인", cat:"한자"},
  {k:"また、あした", r:"", m:"내일 또 봐(요)", cat:"가나"},
  {k:"さようなら", r:"", m:"안녕히 가세요", cat:"가나"},
  {k:"元気でね", r:"げんきでね", m:"잘 지내", cat:"한자"},
  {k:"~も", r:"", m:"~도", cat:"가나"},
  {k:"お願いします", r:"おねがいします", m:"부탁합니다", cat:"한자"},
  {k:"こちらこそ", r:"", m:"이쪽이야말로", cat:"가나"},

  {k:"生徒", r:"せいと", m:"학생", cat:"한자"},
  {k:"みなさん", r:"", m:"여러분", cat:"가나"},
  {k:"留学生", r:"りゅうがくせい", m:"유학생", cat:"한자"},
  {k:"韓国", r:"かんこく", m:"한국", cat:"한자"},
  {k:"~から きました", r:"", m:"~에서 왔습니다", cat:"가나"},
  {k:"~と 申します", r:"~ともうします", m:"~라고 합니다", cat:"한자"},
  {k:"趣味", r:"しゅみ", m:"취미", cat:"한자"},
  {k:"~は", r:"", m:"~은/는", cat:"가나"},
  {k:"スポーツ", r:"", m:"스포츠", cat:"가나"},
  {k:"席", r:"せき", m:"자리", cat:"한자"},
  {k:"あそこ", r:"", m:"저기", cat:"가나"},
  {k:"私", r:"わたし", m:"나, 저", cat:"한자"},
  {k:"あら", r:"", m:"어머", cat:"가나"},
  {k:"今年", r:"ことし", m:"올해", cat:"한자"},
  {k:"~年生", r:"~ねんせい", m:"~학년", cat:"한자"},
  {k:"~じゃ ありません", r:"", m:"~이/가 아닙니다", cat:"가나"},
  {k:"そう", r:"", m:"그래", cat:"가나"},
  {k:"同じ", r:"おなじ", m:"같은", cat:"한자"},
  {k:"クラス", r:"", m:"반", cat:"가나"},
  {k:"では", r:"", m:"그럼", cat:"가나"},
  {k:"失礼します", r:"しつれいします", m:"실례하겠습니다", cat:"한자"},
  {k:"おやすみなさい", r:"", m:"안녕히 주무세요", cat:"가나"},
  {k:"お母さん", r:"おかあさん", m:"어머니", cat:"한자"},
  {k:"~に", r:"", m:"~에게", cat:"가나"},

  {k:"ソウル", r:"", m:"서울", cat:"가나"},
  {k:"~こそ", r:"", m:"~야말로", cat:"가나"},
  {k:"先輩", r:"せんぱい", m:"선배", cat:"한자"},
  {k:"日本", r:"にほん", m:"일본", cat:"한자"},
  {k:"東京", r:"とうきょう", m:"도쿄", cat:"한자"},
  {k:"後輩", r:"こうはい", m:"후배", cat:"한자"},
  {k:"中国", r:"ちゅうごく", m:"중국", cat:"한자"},
  {k:"ペキン", r:"", m:"베이징", cat:"가나"},
  {k:"何", r:"なに・なん", m:"무엇", cat:"한자"},
  {k:"料理", r:"りょうり", m:"요리", cat:"한자"},
  {k:"水泳", r:"すいえい", m:"수영", cat:"한자"},
  {k:"映画", r:"えいが", m:"영화", cat:"한자"},
  {k:"バスケ", r:"", m:"농구", cat:"가나"},
  {k:"写真", r:"しゃしん", m:"사진", cat:"한자"},
  {k:"音楽", r:"おんがく", m:"음악", cat:"한자"},

  {k:"組", r:"くみ", m:"반", cat:"한자"},
  {k:"K-POP", r:"ケイ・ポップ", m:"케이팝", cat:"가나"},
  {k:"アニメ", r:"", m:"애니메이션", cat:"가나"},

  {k:"アメリカ", r:"", m:"미국", cat:"가나"},
  {k:"ニューヨーク", r:"", m:"뉴욕", cat:"가나"},

  {k:"高校生", r:"こうこうせい", m:"고교생", cat:"한자"},
  {k:"~人", r:"~じん", m:"~인", cat:"한자"},
  {k:"大阪", r:"おおさか", m:"오사카", cat:"한자"},
  {k:"イギリス", r:"", m:"영국", cat:"가나"},
  {k:"ロンドン", r:"", m:"런던", cat:"가나"},

  {k:"電気", r:"でんき", m:"전기", cat:"한자"},
  {k:"課長", r:"かちょう", m:"과장", cat:"한자"},
  {k:"電話", r:"でんわ", m:"전화", cat:"한자"},

  {k:"サッカー", r:"", m:"축구", cat:"가나"},

  {k:"北海道", r:"ほっかいどう", m:"홋카이도", cat:"한자"},
  {k:"本州", r:"ほんしゅう", m:"혼슈", cat:"한자"},
  {k:"四国", r:"しこく", m:"시코쿠", cat:"한자"},
  {k:"九州", r:"きゅうしゅう", m:"규슈", cat:"한자"},
];

// ---------------- 상태 ----------------
const STORAGE_KEY = "jp_flashcards_progress_v13";
let known = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); // {index: true}
let currentCat = "전체";
let order = [];
let pos = 0;
let flipped = false;
let reviewOnly = false;

function cardId(card){ return card.k + "|" + card.r; }

function buildOrder(){
  let base = DATA.map((c,i)=>i).filter(i=>{
    const c = DATA[i];
    if(currentCat !== "전체" && c.cat !== currentCat) return false;
    if(reviewOnly && known[cardId(c)]) return false;
    return true;
  });
  order = base;
  pos = 0;
}

function shuffleOrder(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  pos = 0;
  render();
}

function resetShuffleOrder(){
  buildOrder();
  render();
}

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
}

function countKnownInScope(){
  let scopeIdx = DATA.map((c,i)=>i).filter(i => currentCat==="전체" || DATA[i].cat===currentCat);
  return scopeIdx.filter(i => known[cardId(DATA[i])]).length;
}

function render(){
  const total = order.length;
  document.getElementById("totalCount").textContent = DATA.length;
  document.getElementById("knownLabel").textContent = "외운 단어: " + countKnownInScope();

  const cardEl = document.getElementById("card");
  const wasFlipped = cardEl.classList.contains("flipped");
  if(wasFlipped){
    cardEl.classList.add("no-anim");
  }
  cardEl.classList.remove("flipped");
  flipped = false;

  if(total === 0){
    document.getElementById("posLabel").textContent = "0 / 0";
    document.getElementById("progressFill").style.width = "0%";
    document.getElementById("wordFront").textContent = "";
    document.getElementById("meaningBack").textContent = "";
    document.getElementById("readingBack").textContent = "";
    document.getElementById("tagFront").textContent = "";
    document.getElementById("tagBack").textContent = "";
    document.querySelector(".card-wrap").style.display = "none";
    document.querySelector(".nav-row").style.display = "none";
    document.querySelector(".know-row").style.display = "none";
    let empty = document.getElementById("emptyMsg");
    if(!empty){
      empty = document.createElement("div");
      empty.id = "emptyMsg";
      empty.className = "empty";
      empty.textContent = "🎉 이 조건에 해당하는 카드가 없어요.\n(안 외운 단어만 보기를 껐다가 다시 시도해보세요)";
      document.body.appendChild(empty);
    }
    return;
  } else {
    document.querySelector(".card-wrap").style.display = "";
    document.querySelector(".nav-row").style.display = "";
    document.querySelector(".know-row").style.display = "";
    const empty = document.getElementById("emptyMsg");
    if(empty) empty.remove();
  }

  const idx = order[pos];
  const card = DATA[idx];

  document.getElementById("posLabel").textContent = (pos+1) + " / " + total;
  document.getElementById("progressFill").style.width = ((pos+1)/total*100) + "%";

  document.getElementById("wordFront").textContent = card.k;
  document.getElementById("tagFront").textContent = card.cat;
  document.getElementById("tagBack").textContent = card.cat;
  document.getElementById("wordBack").textContent = card.k;
  document.getElementById("readingBack").textContent = card.r ? card.r : "";
  document.getElementById("meaningBack").textContent = card.m;

  const isKnown = known[cardId(card)];
  document.getElementById("knownBtn").classList.toggle("on-known", !!isKnown);
  document.getElementById("unknownBtn").classList.toggle("on-unknown", isKnown === false);

  if(wasFlipped){
    // force reflow so the instant (no-transition) reset actually applies,
    // then re-enable the flip animation for the next manual flip
    void cardEl.offsetHeight;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        cardEl.classList.remove("no-anim");
      });
    });
  }
}

function flip(){
  if(order.length === 0) return;
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
}

function next(){
  if(order.length === 0) return;
  pos = (pos+1) % order.length;
  render();
}
function prev(){
  if(order.length === 0) return;
  pos = (pos-1+order.length) % order.length;
  render();
}

function markKnown(val){
  if(order.length===0) return;
  const card = DATA[order[pos]];
  if(val === null){
    delete known[cardId(card)];
  } else {
    known[cardId(card)] = val;
  }
  saveProgress();
  render();
}

// ---------------- 이벤트 ----------------
document.getElementById("card").addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffleOrder);
document.getElementById("resetShuffleBtn").addEventListener("click", resetShuffleOrder);

document.getElementById("knownBtn").addEventListener("click", ()=>{
  const card = DATA[order[pos]];
  if(known[cardId(card)] === true){ markKnown(null); } else { markKnown(true); }
});
document.getElementById("unknownBtn").addEventListener("click", ()=>{
  const card = DATA[order[pos]];
  if(known[cardId(card)] === false){ markKnown(null); } else { markKnown(false); }
});

document.getElementById("reviewOnlyBtn").addEventListener("click", (e)=>{
  reviewOnly = !reviewOnly;
  e.target.classList.toggle("active", reviewOnly);
  buildOrder();
  render();
});

document.getElementById("resetProgressBtn").addEventListener("click", ()=>{
  if(confirm("외운 단어 표시를 전부 초기화할까요?")){
    known = {};
    saveProgress();
    render();
  }
});

document.addEventListener("keydown",(e)=>{
  if(e.code === "Space"){ e.preventDefault(); flip(); }
  else if(e.code === "ArrowRight"){ next(); }
  else if(e.code === "ArrowLeft"){ prev(); }
});

// 카테고리 탭
const cats = ["전체","한자","가나"];
const catLabels = {"전체":"전체","한자":"한자 단어","가나":"히라가나/가타카나"};
const tabsWrap = document.getElementById("catTabs");
cats.forEach(cat=>{
  const btn = document.createElement("button");
  btn.className = "tab" + (cat===currentCat ? " active" : "");
  btn.textContent = catLabels[cat];
  btn.addEventListener("click", ()=>{
    currentCat = cat;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    buildOrder();
    render();
  });
  tabsWrap.appendChild(btn);
});

// 초기화
buildOrder();
render();
</script>
</body>
</html>
