<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히라가나 플래시카드</title>
<style>
  :root{
    --bg:#fff2ea;
    --card:#ffffff;
    --accent:#ff6f61;
    --accent2:#ff9d3d;
    --blue:#e8536a;
    --text:#2c2c2c;
    --sub:#a98a72;
    --border:#ffdcc2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(160deg, #fff6ea 0%, #ffeaf0 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .logo-flower{
    position:relative;
    width:52px;
    height:52px;
    flex-shrink:0;
  }
  .petal{
    position:absolute;
    mix-blend-mode:multiply;
  }
  .petal.yellow{
    width:32px;height:36px;
    top:0;left:11px;
    background:#f5e08a;
    border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
    transform:rotate(-8deg);
  }
  .petal.blue{
    width:30px;height:30px;
    top:13px;left:0;
    background:#a9d3e8;
    border-radius:50%;
  }
  .petal.pink{
    width:34px;height:36px;
    top:20px;left:10px;
    background:#f2c1da;
    border-radius:45% 45% 55% 55% / 40% 40% 60% 60%;
  }
  .petal.green{
    width:26px;height:26px;
    top:10px;left:24px;
    background:#c7d98d;
    border-radius:50%;
  }
  .petal.peach{
    width:20px;height:20px;
    top:4px;left:16px;
    background:#f0ba90;
    border-radius:50%;
  }
  .logo-flower span{
    position:absolute;
    font-size:9px;
    font-weight:700;
    color:#fff;
    text-shadow:0 0 2px rgba(0,0,0,0.15);
  }
  .logo-flower .ch1{ top:20px; left:6px; }
  .logo-flower .ch2{ top:20px; left:19px; }
  .logo-flower .ch3{ top:16px; left:31px; color:#e9e9e9; }
  .brand-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .brand-name .c1{ color:#e79ac0; }
  .brand-name .c2{ color:#8ec3e0; }
  .brand-name .c3{ color:#9a9a9a; }
  h1{
    font-size:20px;
    margin:0 0 4px;
    font-weight:700;
  }
  .subtitle{
    font-size:13px;
    color:var(--sub);
    margin-bottom:18px;
  }
  .controls-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:16px;
  }
  .tab{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    cursor:pointer;
    color:var(--text);
  }
  .tab.active{
    background:var(--accent2);
    color:#fff;
    border-color:var(--accent2);
  }
  .progress-wrap{
    width:100%;
    max-width:420px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--sub);
    margin-bottom:10px;
  }
  .progress-bar-bg{
    width:100%;
    max-width:420px;
    height:5px;
    background:var(--border);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--accent2);
    transition:width .2s ease;
  }
  .card-wrap{
    width:100%;
    max-width:420px;
    height:360px;
    perspective:1200px;
    margin-bottom:22px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card.flipped{
    transform:rotateY(180deg);
  }
  .card.no-anim{
    transition:none !important;
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:18px;
    background:var(--card);
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    border:1px solid var(--border);
  }
  .face.back{
    transform:rotateY(180deg);
  }
  .tag{
    position:absolute;
    top:14px;
    left:16px;
    font-size:11px;
    color:var(--sub);
    background:var(--bg);
    padding:3px 9px;
    border-radius:10px;
  }
  .word{
    font-size:clamp(90px, 30vw, 140px);
    font-weight:700;
    line-height:1.2;
    word-break:keep-all;
  }
  .reading{
    font-size:18px;
    color:var(--accent2);
    margin-top:10px;
  }
  .meaning{
    font-size:clamp(30px, 9vw, 40px);
    font-weight:700;
    color:var(--blue);
    margin-bottom:10px;
  }
  .word-back{
    font-size:clamp(70px, 22vw, 100px);
    font-weight:700;
    color:var(--text);
    margin-bottom:14px;
  }
  .reading-small{
    font-size:clamp(22px, 6.5vw, 28px);
    font-weight:700;
    color:var(--text);
  }
  .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:6px;
  }
  .nav-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:16px;
  }
  .nav-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:var(--accent2);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .nav-btn:active{
    transform:scale(0.95);
  }
  .flip-btn{
    background:var(--accent);
    border-radius:24px;
    width:auto;
    padding:0 22px;
    font-size:14px;
    height:44px;
  }
  .know-row{
    display:flex;
    gap:10px;
    margin-bottom:8px;
  }
  .know-btn{
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    cursor:pointer;
  }
  .know-btn.on-known{
    background:#e7f3ea;
    border-color:#3f9a55;
    color:#2c6e3d;
  }
  .know-btn.on-unknown{
    background:#fbeaea;
    border-color:var(--accent);
    color:var(--accent);
  }
  .bottom-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:6px;
  }
  .small-btn{
    padding:7px 13px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#fff;
    font-size:12px;
    color:var(--sub);
    cursor:pointer;
  }
  .small-btn.active{
    background:#fff3e0;
    border-color:#e0a030;
    color:#a06a00;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    margin-top:40px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="brand">
  <div class="logo-flower">
    <div class="petal yellow"></div>
    <div class="petal blue"></div>
    <div class="petal pink"></div>
    <div class="petal green"></div>
    <div class="petal peach"></div>
    <span class="ch1">こ</span><span class="ch2">こ</span><span class="ch3">ろ</span>
  </div>
  <div class="brand-name"><span class="c1">코코로</span><span class="c2">원어민</span><span class="c3">일본어</span></div>
</div>

<h1>히라가나 플래시카드</h1>
<div class="subtitle">카드를 클릭(또는 Space)하면 로마자 읽기가 나와요 · 총 <span id="totalCount">0</span>개</div>

<div class="controls-row" id="catTabs"></div>

<div class="progress-wrap">
  <span id="posLabel">0 / 0</span>
  <span id="knownLabel">외운 단어: 0</span>
</div>
<div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>

<div class="card-wrap">
  <div class="card" id="card">
    <div class="face front">
      <span class="tag" id="tagFront"></span>
      <div class="word" id="wordFront"></div>
      <div class="hint">탭해서 읽는 법 보기</div>
    </div>
    <div class="face back">
      <span class="tag" id="tagBack"></span>
      <div class="word-back" id="wordBack"></div>
      <div class="reading-small" id="readingBack"></div>
      <div class="meaning" id="meaningBack"></div>
    </div>
  </div>
</div>

<div class="know-row">
  <button class="know-btn" id="knownBtn">✓ 외웠어요</button>
  <button class="know-btn" id="unknownBtn">✗ 다시 볼래요</button>
</div>

<div class="nav-row">
  <button class="nav-btn" id="prevBtn">‹</button>
  <button class="nav-btn flip-btn" id="flipBtn">뒤집기</button>
  <button class="nav-btn" id="nextBtn">›</button>
</div>

<div class="bottom-row">
  <button class="small-btn" id="shuffleBtn">🔀 섞기</button>
  <button class="small-btn" id="resetShuffleBtn">↺ 원래 순서</button>
  <button class="small-btn" id="reviewOnlyBtn">📌 안 외운 단어만</button>
  <button class="small-btn" id="resetProgressBtn">🗑 기록 초기화</button>
</div>

<script>
// ---------------- 단어 데이터 ----------------
const DATA = [
  {k:"あ", r:"", m:"a", cat:"청음"},
  {k:"い", r:"", m:"i", cat:"청음"},
  {k:"う", r:"", m:"u", cat:"청음"},
  {k:"え", r:"", m:"e", cat:"청음"},
  {k:"お", r:"", m:"o", cat:"청음"},

  {k:"か", r:"", m:"ka", cat:"청음"},
  {k:"き", r:"", m:"ki", cat:"청음"},
  {k:"く", r:"", m:"ku", cat:"청음"},
  {k:"け", r:"", m:"ke", cat:"청음"},
  {k:"こ", r:"", m:"ko", cat:"청음"},

  {k:"さ", r:"", m:"sa", cat:"청음"},
  {k:"し", r:"", m:"shi", cat:"청음"},
  {k:"す", r:"", m:"su", cat:"청음"},
  {k:"せ", r:"", m:"se", cat:"청음"},
  {k:"そ", r:"", m:"so", cat:"청음"},

  {k:"た", r:"", m:"ta", cat:"청음"},
  {k:"ち", r:"", m:"chi", cat:"청음"},
  {k:"つ", r:"", m:"tsu", cat:"청음"},
  {k:"て", r:"", m:"te", cat:"청음"},
  {k:"と", r:"", m:"to", cat:"청음"},

  {k:"な", r:"", m:"na", cat:"청음"},
  {k:"に", r:"", m:"ni", cat:"청음"},
  {k:"ぬ", r:"", m:"nu", cat:"청음"},
  {k:"ね", r:"", m:"ne", cat:"청음"},
  {k:"の", r:"", m:"no", cat:"청음"},

  {k:"は", r:"", m:"ha", cat:"청음"},
  {k:"ひ", r:"", m:"hi", cat:"청음"},
  {k:"ふ", r:"", m:"fu", cat:"청음"},
  {k:"へ", r:"", m:"he", cat:"청음"},
  {k:"ほ", r:"", m:"ho", cat:"청음"},

  {k:"ま", r:"", m:"ma", cat:"청음"},
  {k:"み", r:"", m:"mi", cat:"청음"},
  {k:"む", r:"", m:"mu", cat:"청음"},
  {k:"め", r:"", m:"me", cat:"청음"},
  {k:"も", r:"", m:"mo", cat:"청음"},

  {k:"や", r:"", m:"ya", cat:"청음"},
  {k:"ゆ", r:"", m:"yu", cat:"청음"},
  {k:"よ", r:"", m:"yo", cat:"청음"},

  {k:"ら", r:"", m:"ra", cat:"청음"},
  {k:"り", r:"", m:"ri", cat:"청음"},
  {k:"る", r:"", m:"ru", cat:"청음"},
  {k:"れ", r:"", m:"re", cat:"청음"},
  {k:"ろ", r:"", m:"ro", cat:"청음"},

  {k:"わ", r:"", m:"wa", cat:"청음"},
  {k:"を", r:"", m:"wo", cat:"청음"},
  {k:"ん", r:"", m:"n", cat:"청음"},

  {k:"が", r:"", m:"ga", cat:"탁음"},
  {k:"ぎ", r:"", m:"gi", cat:"탁음"},
  {k:"ぐ", r:"", m:"gu", cat:"탁음"},
  {k:"げ", r:"", m:"ge", cat:"탁음"},
  {k:"ご", r:"", m:"go", cat:"탁음"},

  {k:"ざ", r:"", m:"za", cat:"탁음"},
  {k:"じ", r:"", m:"ji", cat:"탁음"},
  {k:"ず", r:"", m:"zu", cat:"탁음"},
  {k:"ぜ", r:"", m:"ze", cat:"탁음"},
  {k:"ぞ", r:"", m:"zo", cat:"탁음"},

  {k:"だ", r:"", m:"da", cat:"탁음"},
  {k:"ぢ", r:"", m:"ji", cat:"탁음"},
  {k:"づ", r:"", m:"zu", cat:"탁음"},
  {k:"で", r:"", m:"de", cat:"탁음"},
  {k:"ど", r:"", m:"do", cat:"탁음"},

  {k:"ば", r:"", m:"ba", cat:"탁음"},
  {k:"び", r:"", m:"bi", cat:"탁음"},
  {k:"ぶ", r:"", m:"bu", cat:"탁음"},
  {k:"べ", r:"", m:"be", cat:"탁음"},
  {k:"ぼ", r:"", m:"bo", cat:"탁음"},

  {k:"ぱ", r:"", m:"pa", cat:"반탁음"},
  {k:"ぴ", r:"", m:"pi", cat:"반탁음"},
  {k:"ぷ", r:"", m:"pu", cat:"반탁음"},
  {k:"ぺ", r:"", m:"pe", cat:"반탁음"},
  {k:"ぽ", r:"", m:"po", cat:"반탁음"},

  {k:"きゃ", r:"", m:"kya", cat:"요음"},
  {k:"きゅ", r:"", m:"kyu", cat:"요음"},
  {k:"きょ", r:"", m:"kyo", cat:"요음"},

  {k:"しゃ", r:"", m:"sha", cat:"요음"},
  {k:"しゅ", r:"", m:"shu", cat:"요음"},
  {k:"しょ", r:"", m:"sho", cat:"요음"},

  {k:"ちゃ", r:"", m:"cha", cat:"요음"},
  {k:"ちゅ", r:"", m:"chu", cat:"요음"},
  {k:"ちょ", r:"", m:"cho", cat:"요음"},

  {k:"にゃ", r:"", m:"nya", cat:"요음"},
  {k:"にゅ", r:"", m:"nyu", cat:"요음"},
  {k:"にょ", r:"", m:"nyo", cat:"요음"},

  {k:"ひゃ", r:"", m:"hya", cat:"요음"},
  {k:"ひゅ", r:"", m:"hyu", cat:"요음"},
  {k:"ひょ", r:"", m:"hyo", cat:"요음"},

  {k:"みゃ", r:"", m:"mya", cat:"요음"},
  {k:"みゅ", r:"", m:"myu", cat:"요음"},
  {k:"みょ", r:"", m:"myo", cat:"요음"},

  {k:"りゃ", r:"", m:"rya", cat:"요음"},
  {k:"りゅ", r:"", m:"ryu", cat:"요음"},
  {k:"りょ", r:"", m:"ryo", cat:"요음"},

  {k:"ぎゃ", r:"", m:"gya", cat:"요음"},
  {k:"ぎゅ", r:"", m:"gyu", cat:"요음"},
  {k:"ぎょ", r:"", m:"gyo", cat:"요음"},

  {k:"じゃ", r:"", m:"ja", cat:"요음"},
  {k:"じゅ", r:"", m:"ju", cat:"요음"},
  {k:"じょ", r:"", m:"jo", cat:"요음"},

  {k:"びゃ", r:"", m:"bya", cat:"요음"},
  {k:"びゅ", r:"", m:"byu", cat:"요음"},
  {k:"びょ", r:"", m:"byo", cat:"요음"},

  {k:"ぴゃ", r:"", m:"pya", cat:"요음"},
  {k:"ぴゅ", r:"", m:"pyu", cat:"요음"},
  {k:"ぴょ", r:"", m:"pyo", cat:"요음"},
];

// ---------------- 상태 ----------------
const STORAGE_KEY = "jp_flashcards_progress_hiragana_v1";
let known = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); // {index: true}
let currentCat = "전체";
let order = [];
let pos = 0;
let flipped = false;
let reviewOnly = false;

function cardId(card){ return card.k + "|" + card.r; }

function buildOrder(){
  let base = DATA.map((c,i)=>i).filter(i=>{
    const c = DATA[i];
    if(currentCat !== "전체" && c.cat !== currentCat) return false;
    if(reviewOnly && known[cardId(c)]) return false;
    return true;
  });
  order = base;
  pos = 0;
}

function shuffleOrder(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  pos = 0;
  render();
}

function resetShuffleOrder(){
  buildOrder();
  render();
}

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
}

function countKnownInScope(){
  let scopeIdx = DATA.map((c,i)=>i).filter(i => currentCat==="전체" || DATA[i].cat===currentCat);
  return scopeIdx.filter(i => known[cardId(DATA[i])]).length;
}

function render(){
  const total = order.length;
  document.getElementById("totalCount").textContent = DATA.length;
  document.getElementById("knownLabel").textContent = "외운 단어: " + countKnownInScope();

  const cardEl = document.getElementById("card");
  const wasFlipped = cardEl.classList.contains("flipped");
  if(wasFlipped){
    cardEl.classList.add("no-anim");
  }
  cardEl.classList.remove("flipped");
  flipped = false;

  if(total === 0){
    document.getElementById("posLabel").textContent = "0 / 0";
    document.getElementById("progressFill").style.width = "0%";
    document.getElementById("wordFront").textContent = "";
    document.getElementById("meaningBack").textContent = "";
    document.getElementById("readingBack").textContent = "";
    document.getElementById("tagFront").textContent = "";
    document.getElementById("tagBack").textContent = "";
    document.querySelector(".card-wrap").style.display = "none";
    document.querySelector(".nav-row").style.display = "none";
    document.querySelector(".know-row").style.display = "none";
    let empty = document.getElementById("emptyMsg");
    if(!empty){
      empty = document.createElement("div");
      empty.id = "emptyMsg";
      empty.className = "empty";
      empty.textContent = "🎉 이 조건에 해당하는 카드가 없어요.\n(안 외운 단어만 보기를 껐다가 다시 시도해보세요)";
      document.body.appendChild(empty);
    }
    return;
  } else {
    document.querySelector(".card-wrap").style.display = "";
    document.querySelector(".nav-row").style.display = "";
    document.querySelector(".know-row").style.display = "";
    const empty = document.getElementById("emptyMsg");
    if(empty) empty.remove();
  }

  const idx = order[pos];
  const card = DATA[idx];

  document.getElementById("posLabel").textContent = (pos+1) + " / " + total;
  document.getElementById("progressFill").style.width = ((pos+1)/total*100) + "%";

  document.getElementById("wordFront").textContent = card.k;
  document.getElementById("tagFront").textContent = card.cat;
  document.getElementById("tagBack").textContent = card.cat;
  document.getElementById("wordBack").textContent = card.k;
  document.getElementById("readingBack").textContent = card.r ? card.r : "";
  document.getElementById("meaningBack").textContent = card.m;

  const isKnown = known[cardId(card)];
  document.getElementById("knownBtn").classList.toggle("on-known", !!isKnown);
  document.getElementById("unknownBtn").classList.toggle("on-unknown", isKnown === false);

  if(wasFlipped){
    // force reflow so the instant (no-transition) reset actually applies,
    // then re-enable the flip animation for the next manual flip
    void cardEl.offsetHeight;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        cardEl.classList.remove("no-anim");
      });
    });
  }
}

function flip(){
  if(order.length === 0) return;
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
}

function next(){
  if(order.length === 0) return;
  pos = (pos+1) % order.length;
  render();
}
function prev(){
  if(order.length === 0) return;
  pos = (pos-1+order.length) % order.length;
  render();
}

function markKnown(val){
  if(order.length===0) return;
  const card = DATA[order[pos]];
  if(val === null){
    delete known[cardId(card)];
  } else {
    known[cardId(card)] = val;
  }
  saveProgress();
  render();
}

// ---------------- 이벤트 ----------------
document.getElementById("card").addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffleOrder);
document.getElementById("resetShuffleBtn").addEventListener("click", resetShuffleOrder);

document.getElementById("knownBtn").addEventListener("click", ()=>{
  const card = DATA[order[pos]];
  if(known[cardId(card)] === true){ markKnown(null); } else { markKnown(true); }
});
document.getElementById("unknownBtn").addEventListener("click", ()=>{
  const card = DATA[order[pos]];
  if(known[cardId(card)] === false){ markKnown(null); } else { markKnown(false); }
});

document.getElementById("reviewOnlyBtn").addEventListener("click", (e)=>{
  reviewOnly = !reviewOnly;
  e.target.classList.toggle("active", reviewOnly);
  buildOrder();
  render();
});

document.getElementById("resetProgressBtn").addEventListener("click", ()=>{
  if(confirm("외운 단어 표시를 전부 초기화할까요?")){
    known = {};
    saveProgress();
    render();
  }
});

document.addEventListener("keydown",(e)=>{
  if(e.code === "Space"){ e.preventDefault(); flip(); }
  else if(e.code === "ArrowRight"){ next(); }
  else if(e.code === "ArrowLeft"){ prev(); }
});

// 카테고리 탭
const cats = ["전체","청음","탁음","반탁음","요음"];
const catLabels = {"전체":"전체","청음":"청음","탁음":"탁음","반탁음":"반탁음","요음":"요음"};
const tabsWrap = document.getElementById("catTabs");
cats.forEach(cat=>{
  const btn = document.createElement("button");
  btn.className = "tab" + (cat===currentCat ? " active" : "");
  btn.textContent = catLabels[cat];
  btn.addEventListener("click", ()=>{
    currentCat = cat;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    buildOrder();
    render();
  });
  tabsWrap.appendChild(btn);
});

// 초기화
buildOrder();
render();
</script>
</body>
</html>
